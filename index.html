    <meta name="description" content="ÉLVARA - Accessible premium contemporary fashion. Timeless essentials crafted with uncompromising quality and understated elegance." />

  <body style="background-color: #F9EDF0; color: #49111C;" class="bg-[#F9EDF0] text-[#49111C] antialiased selection:bg-[#49111C] selection:text-[#F9EDF0]">
    <div id="root" style="background-color: #F9EDF0; min-height: 100vh;"></div>
    <!-- BotPulse Real-Time AI Bot Detection & Prevention SDK -->
    <script src="/botpulse.js"></script>
    <script>
      (function() {
        if (!window.BotPulse) return;
        var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        
        // 1. Fallback endpoint (active tunnel or localhost)
        var fallbackEndpoint = isLocal
          ? "http://localhost:8000/api/v1"
          : "https://attraction-jesus-winner-supervision.trycloudflare.com/api/v1";

        // 2. Check URL query parameters (?bp_api=https://... or ?api=https://...)
        var queryEndpoint = null;
        try {
          var params = new URLSearchParams(window.location.search);
          var p = params.get('bp_api') || params.get('api');
          if (p) {
            queryEndpoint = p.replace(/\/+$/, '');
            localStorage.setItem('bp_api_url', queryEndpoint);
          }
        } catch (e) {}

        // 3. Check saved localStorage endpoint and clean stale tunnels
        var savedEndpoint = null;
        try {
          savedEndpoint = localStorage.getItem('bp_api_url');
          if (savedEndpoint && savedEndpoint.indexOf('.trycloudflare.com') !== -1 && savedEndpoint !== fallbackEndpoint) {
            localStorage.removeItem('bp_api_url');
            savedEndpoint = null;
          }
        } catch (e) {}

        var activeEndpoint = (queryEndpoint || savedEndpoint || fallbackEndpoint).replace(/\/+$/, '');
        if (activeEndpoint.endsWith('/telemetry')) {
          activeEndpoint = activeEndpoint.replace(/\/telemetry$/, '');
        }

        window.BotPulse.init({
          siteKey: "bp_pub_alvera_live_7c4f19e",
          endpoint: activeEndpoint,
          enabled: true,
          onDecision: function(decision) {
            console.log("[BotPulse Security] Signed Prevention Decision:", decision);
          }
        });
        console.log("[BotPulse Security] Active Telemetry Endpoint:", activeEndpoint);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
